# Lets a freshly shown screen settle before its picture. (A pull-down here, tried in run 39305566587,
# made the iPhone Home title blur too; the blur itself was the app's header blur material on iOS 26,
# fixed in the app — tab-stack.tsx.)
appId: com.rukncoupons.app
---
- waitForAnimationToEnd:
    timeout: 6000
# A wait for text that is never on screen, as a fixed pause.
- extendedWaitUntil:
    visible: "zz-never-on-screen-zz"
    timeout: 4000
    optional: true
- waitForAnimationToEnd:
    timeout: 6000

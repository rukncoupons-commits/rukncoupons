# The light-mode screens, in one pass. Texts come from run.sh per language (the app's own i18n strings).
#
# Order matters on iOS 26: the tab bar shrinks to one button once a screen is scrolled down, and a short
# scroll back up did not restore it on the runner. So every tab tap happens on an unscrolled screen —
# after a relaunch where needed. The store is Max Fashion (ONTIME variable): its page has the «who it
# suits» block in both languages, and that block comes BEFORE the policies (screens/store.tsx).
#
# Run 39296214731 showed three things this file now answers:
# - the code sheet never opened from its deep link on the iOS Simulator (the picture was the store page,
#   on iPhone and iPad alike), so the code is opened the way a user opens it: store page → the coupon;
# - on the iPad the suitability block already shows in the follow picture, so the two came out identical;
# - large titles came out blurred: the app's header blur material stacked on iOS 26's own edge effect
#   (fixed in the app, tab-stack.tsx); screens still settle before their picture.
appId: com.rukncoupons.app
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: ${CONTINUE}
    timeout: 45000
- tapOn: ${CONTINUE}
# Home is ready once the catalogue has loaded and the store grid's heading is on screen.
- extendedWaitUntil:
    visible: ${STORES_WITH_CODES}
    timeout: 45000
- runFlow: settle.yaml
- takeScreenshot: home

- tapOn: ${TAB_STORES}
- runFlow: settle.yaml
- takeScreenshot: stores

# A store card is one button read as «<name>, <offer>», so the name alone does not match it.
# Half visible is enough and the card is centred: run 41118617975 stopped with Max Fashion's card at the
# bottom edge, partly under the floating tab button, as the list grew with new stores.
- scrollUntilVisible:
    element:
      text: "${ONTIME}.*"
    direction: DOWN
    timeout: 45000
    visibilityPercentage: 50
    centerElement: true
- tapOn: "${ONTIME}.*"
# Matched on the end of the label: «نبّهني» carries a shadda the accessibility text did not match.
- extendedWaitUntil:
    visible: "${FOLLOW}"
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: follow

- scrollUntilVisible:
    element:
      text: "${WHO_SUITS}.*"
    direction: DOWN
    centerElement: true
# On the iPad the block is already on screen, so nothing scrolls. One long swipe (run 41118617975) moved
# the English page and not the Arabic one, so: short swipes until the «Offers» heading above the block
# has left the screen — the block then sits at the top.
- runFlow:
    when:
      true: ${DEVICE == 'ipad'}
    commands:
      - repeat:
          times: 10
          while:
            visible: "${OFFERS}"
          commands:
            - swipe:
                start: 50%, 62%
                end: 50%, 47%
                duration: 700
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: suitability

- scrollUntilVisible:
    element:
      text: "${SHIPPING}.*"
    direction: DOWN
    centerElement: true
# The iPad again: shipping is already visible in the suitability picture, so swipe until the «when it isn't
# worth it» heading has gone and the practical details lead the screen.
- runFlow:
    when:
      true: ${DEVICE == 'ipad'}
    commands:
      - repeat:
          times: 12
          while:
            visible: "${WHEN_NOT}.*"
          commands:
            - swipe:
                start: 50%, 62%
                end: 50%, 47%
                duration: 700
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: policies

# The code sheet: relaunch to an unscrolled Home, then Stores → the code's store → the coupon.
- launchApp:
    clearState: false
    stopApp: true
- extendedWaitUntil:
    visible: ${STORES_WITH_CODES}
    timeout: 45000
- tapOn: ${TAB_STORES}
- waitForAnimationToEnd:
    timeout: 5000
- scrollUntilVisible:
    element:
      text: "${CODE_STORE}.*"
    direction: DOWN
    timeout: 60000
- tapOn: "${CODE_STORE}.*"
# The coupon card is one button labelled with its title (prefixed by the store name in some lists).
- scrollUntilVisible:
    element:
      text: ".*${CODE_TITLE}.*"
    direction: DOWN
    centerElement: true
- tapOn: ".*${CODE_TITLE}.*"
# Run 39305566587: the sheet opened every time, but the button's accessibility text never equalled
# the plain label, so this wait is lenient and never stops the flow.
- extendedWaitUntil:
    visible: ".*${COPY_OPEN}.*"
    timeout: 15000
    optional: true
- runFlow: settle.yaml
- takeScreenshot: code

# Categories last: a relaunch lands on an unscrolled Home. The heading is centred, then lifted by a SLOW
# swipe — a fast one flung past it on the iPhone and cut the first row of cards.
- launchApp:
    clearState: false
    stopApp: true
- extendedWaitUntil:
    visible: ${STORES_WITH_CODES}
    timeout: 45000
- scrollUntilVisible:
    element:
      text: ${CATEGORIES}
    direction: DOWN
    centerElement: true
- swipe:
    start: 50%, 70%
    end: 50%, 38%
    duration: 3000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: categories

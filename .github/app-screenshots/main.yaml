# The light-mode screens, in one pass. Texts come from run.sh per language (the app's own i18n strings).
appId: com.rukncoupons.app
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: ${CONTINUE}
    timeout: 45000
- tapOn: ${CONTINUE}
# Home is ready once the catalogue has loaded and the store grid's heading is on screen.
- extendedWaitUntil:
    visible: ${STORES_WITH_CODES}
    timeout: 45000
- waitForAnimationToEnd:
    timeout: 6000
- takeScreenshot: ${OUT_DIR}/home

- scrollUntilVisible:
    element:
      text: ${CATEGORIES}
    direction: DOWN
- swipe:
    start: 50%, 78%
    end: 50%, 32%
    duration: 1200
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: ${OUT_DIR}/categories

- tapOn: ${TAB_STORES}
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: ${OUT_DIR}/stores

- scrollUntilVisible:
    element:
      text: ${ONTIME}
    direction: DOWN
- tapOn: ${ONTIME}
- extendedWaitUntil:
    visible: ${FOLLOW}
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: ${OUT_DIR}/follow

- scrollUntilVisible:
    element:
      text: ${WHO_SUITS}
    direction: DOWN
    centerElement: true
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: ${OUT_DIR}/suitability

- scrollUntilVisible:
    element:
      text: ${SHIPPING}
    direction: DOWN
    centerElement: true
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: ${OUT_DIR}/policies

# The code sheet, opened by its deep link (the coupon route is a modal over the tabs).
- openLink: rukncoupons://coupon/${COUPON_ID}
- tapOn:
    text: "Open|فتح"
    optional: true
- waitForAnimationToEnd:
    timeout: 6000
- takeScreenshot: ${OUT_DIR}/code

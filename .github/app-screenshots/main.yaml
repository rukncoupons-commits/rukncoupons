# The light-mode screens, in one pass. Texts come from run.sh per language (the app's own i18n strings).
appId: com.rukncoupons.app
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: ${CONTINUE}
    timeout: 45000
- tapOn: ${CONTINUE}
# Home is ready once the catalogue has loaded and the store grid's heading is on screen.
- extendedWaitUntil:
    visible: ${STORES_WITH_CODES}
    timeout: 45000
- waitForAnimationToEnd:
    timeout: 6000
- takeScreenshot: home

- scrollUntilVisible:
    element:
      text: ${CATEGORIES}
    direction: DOWN
- swipe:
    start: 50%, 78%
    end: 50%, 32%
    duration: 1200
# iOS 26 shrinks the tab bar while scrolling DOWN; a short scroll back up restores it, both for the
# picture and so the Stores tab can be tapped (the first run failed there).
- swipe:
    start: 50%, 42%
    end: 50%, 54%
    duration: 700
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: categories

- tapOn: ${TAB_STORES}
- waitForAnimationToEnd:
    timeout: 5000
# Two rows down, past a store with no logo (الماجد للعود), then back up a touch for the bar. Maestro parses
# swipe points before it substitutes variables, so run.sh writes the per-device value into a copy.
- swipe:
    start: 50%, 75%
    end: 50%, __STORES_SWIPE_END__
    duration: 1600
- swipe:
    start: 50%, 42%
    end: 50%, 50%
    duration: 700
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: stores

# A store card is one button read as «<name>, <offer>», so the name alone does not match it.
- scrollUntilVisible:
    element:
      text: "${ONTIME}.*"
    direction: DOWN
- tapOn: "${ONTIME}.*"
- extendedWaitUntil:
    visible: ${FOLLOW}
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: follow

- scrollUntilVisible:
    element:
      text: "${WHO_SUITS}.*"
    direction: DOWN
    centerElement: true
- swipe:
    start: 50%, 45%
    end: 50%, 53%
    duration: 700
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: suitability

- scrollUntilVisible:
    element:
      text: "${SHIPPING}.*"
    direction: DOWN
    centerElement: true
- swipe:
    start: 50%, 45%
    end: 50%, 53%
    duration: 700
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: policies

# The code sheet, opened by its deep link (the coupon route is a modal over the tabs).
- openLink: rukncoupons://coupon/${COUPON_ID}
- tapOn:
    text: "Open|فتح"
    optional: true
- waitForAnimationToEnd:
    timeout: 6000
- takeScreenshot: code

# App Store screenshots from the REAL iOS Simulator, on a GitHub-hosted Mac.
#
# Lives only on the `app-screenshots` branch. It downloads the app's Simulator build from EAS, runs
# it on an iPhone (6.9") and an iPad (13") simulator in Arabic and English, walks the screens with
# Maestro, and commits the PNGs back to this branch under screenshots-output/. The designed store
# images are composed from them on the owner's machine (ios-app/scripts/compose-store-screenshots.mjs).
#
# Why here: no Mac is available, and Appetize's free plan (30 min/month, 3-minute sessions, no SDK)
# ran out on 2026-10-18 before the set was captured.
name: App Store screenshots (iOS Simulator)

on:
  push:
    branches: [app-screenshots]
    paths: [".github/app-screenshots/**", ".github/workflows/app-screenshots.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: app-screenshots
  cancel-in-progress: true

jobs:
  capture:
    runs-on: macos-26
    # Four captures with up to three attempts each.
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Capture
        env:
          # Simulator build b96838cd (1.1.0 + the iOS 26 header fix in tab-stack.tsx): no blur material on
          # the bar under iOS 26, so large titles should come out sharp. Build 06359b05 had the blurred titles.
          APP_URL: https://expo.dev/artifacts/eas/ool4kJPKxIAqoGRtH_yIAFWJfl1PAFaTlBxP6fjKrHI.tar.gz
        run: bash .github/app-screenshots/run.sh

      # Every file, Maestro's step logs included, as a downloadable artifact of the run.
      - name: Keep everything as a run artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-output
          path: screenshots-output
          retention-days: 14

      # Only the pictures and the log go back to the branch: run 5 captured everything and then
      # failed here, pushing Maestro's whole output folder.
      - name: Commit the screenshots back to this branch
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -r -q --cached screenshots-output 2>/dev/null || true
          git add -f screenshots-output/run.log screenshots-output/*/*.png
          git commit -m "screenshots from ${GITHUB_SHA::7} [skip ci]" || echo "nothing to commit"
          git push origin HEAD:app-screenshots
